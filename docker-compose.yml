services:
  db:
    image: postgres:16-alpine
    container_name: teioos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teioos}
      POSTGRES_USER: ${POSTGRES_USER:-teioos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teioos_user} -d ${POSTGRES_DB:-teioos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    container_name: teioos-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: ./server/admin
      dockerfile: Dockerfile
    container_name: teioos-admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  exam-client:
    build:
      context: ./server/exam-client
      dockerfile: Dockerfile
    container_name: teioos-exam-client
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: ./server/nginx
      dockerfile: Dockerfile
    container_name: teioos-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
      exam-client:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "8080:80"

volumes:
  postgres_data:
    name: teioos_postgres_data

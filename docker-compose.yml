services:
  db:
    image: postgres:16-alpine
    container_name: teioos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teioos}
      POSTGRES_USER: ${POSTGRES_USER:-teioos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teioos_user} -d ${POSTGRES_DB:-teioos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    container_name: teioos-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: ./server/admin
      dockerfile: Dockerfile
    container_name: teioos-admin
    restart: unless-stopped
    ports:
      - "3001:80"

  exam-client:
    build:
      context: ./server/exam-client
      dockerfile: Dockerfile
    container_name: teioos-exam-client
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  postgres_data:
    name: teioos_postgres_data

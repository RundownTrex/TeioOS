server {
    listen 80;
    server_name localhost;

    # Client body size for file uploads and exam submissions
    client_max_body_size 50M;

    # FastAPI Backend API Proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve request headers and body for POST/PUT/PATCH/DELETE methods
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    # Redirect /admin to /admin/
    location = /admin {
        return 301 /admin/;
    }

    # Admin Dashboard Application
    location /admin/ {
        proxy_pass http://admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect /exam to /exam/
    location = /exam {
        return 301 /exam/;
    }

    # Student Examination Client Application
    location /exam/ {
        proxy_pass http://exam-client:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root Gateway Fallback -> Redirect to /exam/
    location = / {
        return 302 /exam/;
    }
}

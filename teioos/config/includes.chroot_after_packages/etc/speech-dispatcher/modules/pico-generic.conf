# ============================================================================
# TeioOS SVOX Pico Generic Speech Dispatcher Module Configuration (pico-generic.conf)
# ============================================================================
# Connects Speech Dispatcher to SVOX Pico via the teioos-pico-synth SSML filter.
# ============================================================================

GenericExecuteSynth "teioos-pico-synth $VOICE \'$DATA\'"

GenericCmdDependency "pico2wave"
GenericCmdDependency "paplay"
GenericCmdDependency "teioos-pico-synth"

GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

GenericMaxChunkLength 500
GenericDelimiters ".!?;:\n"

GenericRateAdd 0
GenericRateMultiply 1
GenericPitchAdd 0
GenericPitchMultiply 1
GenericVolumeAdd 0
GenericVolumeMultiply 1

AddVoice "en" "FEMALE1" "en-US"
AddVoice "en-US" "FEMALE1" "en-US"
AddVoice "en-GB" "FEMALE1" "en-GB"
AddVoice "es" "FEMALE1" "es-ES"
AddVoice "es-ES" "FEMALE1" "es-ES"
AddVoice "fr" "FEMALE1" "fr-FR"
AddVoice "fr-FR" "FEMALE1" "fr-FR"
AddVoice "de" "FEMALE1" "de-DE"
AddVoice "de-DE" "FEMALE1" "de-DE"
AddVoice "it" "FEMALE1" "it-IT"
AddVoice "it-IT" "FEMALE1" "it-IT"

DefaultVoice "en-US"

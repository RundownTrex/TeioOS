# ============================================================================
# TeioOS SVOX Pico Speech Dispatcher Module Configuration (pico.conf)
# ============================================================================

GenericExecuteSynth "/usr/local/bin/teioos-pico-synth $VOICE \'$DATA\'"

GenericCmdDependency "pico2wave"
GenericCmdDependency "paplay"
GenericCmdDependency "/usr/local/bin/teioos-pico-synth"

GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

GenericVolumeRange 100
GenericVolumeNormal 80

GenericRateRange 100
GenericRateNormal 0

GenericPitchRange 100
GenericPitchNormal 0

AddVoice "en" "en-US" "en-US"
AddVoice "en-US" "en-US" "en-US"
AddVoice "en-GB" "en-GB" "en-GB"
AddVoice "es" "es-ES" "es-ES"
AddVoice "es-ES" "es-ES" "es-ES"
AddVoice "fr" "fr-FR" "fr-FR"
AddVoice "fr-FR" "fr-FR" "fr-FR"
AddVoice "de" "de-DE" "de-DE"
AddVoice "de-DE" "de-DE" "de-DE"
AddVoice "it" "it-IT" "it-IT"
AddVoice "it-IT" "it-IT" "it-IT"

DefaultVoice "en-US"

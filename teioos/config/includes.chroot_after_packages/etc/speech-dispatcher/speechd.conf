# ============================================================================
# TeioOS Speech Dispatcher Configuration (speechd.conf)
# ============================================================================
# Configures SVOX Pico as the exclusive native speech synthesis engine for TeioOS.
# ============================================================================

# Audio Output Method (PulseAudio integration)
AudioOutputMethod "pulse"

# Default Language
DefaultLanguage "en"

# SVOX Pico Native Output Module
AddModule "pico" "sd_pico" "pico.conf"

# Set SVOX Pico as Default Synthesis Module (smooth, natural speech)
DefaultModule pico
LanguageDefaultModule "en" "pico"


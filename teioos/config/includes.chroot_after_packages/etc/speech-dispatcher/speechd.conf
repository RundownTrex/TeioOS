# ============================================================================
# TeioOS Speech Dispatcher Configuration (speechd.conf)
# ============================================================================
# Configures the default speech synthesis engine for TeioOS.
# Sets SVOX Pico as the primary high-quality natural voice with espeak-ng fallback.
# ============================================================================

# Audio Output Method (PulseAudio integration)
AudioOutputMethod "pulse"

# Default Language
DefaultLanguage "en"

# Modules Configuration
AddModule "pico" "sd_pico" "pico.conf"
AddModule "espeak-ng" "sd_espeak-ng" "espeak-ng.conf"

# Set SVOX Pico as Default Synthesis Module (smooth, natural speech)
DefaultModule pico

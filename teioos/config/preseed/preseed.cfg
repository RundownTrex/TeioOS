# TeioOS Debian-Installer Preseed Configuration
# Interactive Partitioning, Dual-Boot & Air-Gap Friendly

# 1. Localization & Keyboard Defaults
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# 2. Network Configuration
# Auto-configure network via DHCP (continues gracefully if offline)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string teioos-client
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

# 3. Mirror & Package Source Settings
# Disable external network mirror queries so installation works 100% offline
# Packages (GRUB, kernel, tools) are installed directly from the ISO CDROM pool
d-i apt-setup/use_mirror boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# 4. Account Setup
# Disable root login, pre-create examuser account with kiosk permissions
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string TeioOS Exam User
d-i passwd/username string examuser
d-i passwd/user-password password examuser
d-i passwd/user-password-again password examuser
d-i passwd/user-default-groups string audio video pulse pulse-access input
d-i passwd/auto-login boolean true

# 5. Clock and Time Zone Setup
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# 6. Storage & Partitioning: FULLY INTERACTIVE
# All partman automation is disabled so the administrator/user is prompted to:
# - Select the target storage drive (NVMe, SATA SSD, HDD, virtio)
# - Choose Guided (entire disk / free space alongside Windows) or Manual partitioning
# - Confirm write changes to disk

# 7. Package Selection / Apt Setup
popularity-contest popularity-contest/participate boolean false
tasksel tasksel/first multiselect

# 8. Bootloader Installation (GRUB - BIOS & UEFI & Dual-Boot)
# Explicitly select grub-installer over systemd-boot-installer
d-i base-installer/kernel/override-image string linux-image-amd64
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# 9. Finishing up installation
# Interactive finish dialog confirms completion and reminds user to remove USB
